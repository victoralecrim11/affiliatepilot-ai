name: Python automation tests

on:
  push:
    paths:
      - "automation/**"
      - ".github/workflows/python-automation.yml"
  pull_request:
    paths:
      - "automation/**"
      - ".github/workflows/python-automation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Pillow
        run: python -m pip install -r automation/requirements.txt
      - name: Syntax check
        run: python -m compileall -q automation
      - name: Offline unit tests
        run: python -m unittest discover -s automation/tests -v
